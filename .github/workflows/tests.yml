name: Tests

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test tools
        run: python -m pip install pytest ruff

      - name: Run bootstrap tests
        run: python -m pytest -q

      - name: Check Python compilation
        run: python -m compileall -q custom_components tests

      - name: Check lint and formatting
        run: |
          python -m ruff check custom_components tests
          python -m ruff format --check custom_components tests

      - name: Check whitespace
        run: git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Check frontend contract UI
        working-directory: frontend
        run: npm run check

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build
